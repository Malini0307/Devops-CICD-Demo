name: CI - Build & Code Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install black ruff coverage bandit pytest pytest-cov

      - name: Run Black (code formatting check)
        run: black --check backend

      - name: Run Ruff (linting)
        run: ruff check backend

      - name: Run Bandit (security scan)
        run: bandit -r backend -ll -f json -o bandit-report.json || true

      - name: Run tests with coverage
        working-directory: backend
        run: |
          coverage run -m pytest
          coverage report --fail-under=80

      - name: Generate coverage report
        working-directory: backend
        run: coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  build-docker:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::586622271073:role/Devops-CICD-ECR-Role
          aws-region: us-east-1

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devops-cicd-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devops-cicd-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./employee-frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  auto-merge:
    needs: [build, build-docker]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Merge PR automatically
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr) {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log(`PR #${pr.number} merged successfully!`);
            }

  notify-on-failure:
    needs: build
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send Email Notification on Build Failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ Build Failed - PR #${{ github.event.pull_request.number }}"
          to: ${{ secrets.GMAIL_EMAIL }}
          from: ${{ secrets.GMAIL_EMAIL }}
          body: |
            ❌ Build Failed!

            PR Title: ${{ github.event.pull_request.title }}
            Branch: ${{ github.head_ref }}
            Author: ${{ github.actor }}

            Failed Checks:
            - Black (code formatting)
            - Ruff (linting)
            - Bandit (security scan)
            - Pytest (tests)
            - Coverage (code coverage)

            View Details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please fix the issues and push again.